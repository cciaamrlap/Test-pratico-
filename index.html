    <script>
      (function () {
        var devScript = document.querySelector('script[src="/src/main.tsx"]');
        if (!devScript) return;
        function fallbackToDocs() {
          if (window.__APP_MOUNTED__) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          if (window.location.pathname.indexOf('/docs') === -1) {
            window.location.replace('./docs/');
          }
        }
        devScript.addEventListener('error', fallbackToDocs);
        window.setTimeout(fallbackToDocs, 1200);
      })();

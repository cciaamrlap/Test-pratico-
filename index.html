<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pre-Check Composizione Negoziata — Test Pratico Ministeriale</title>
    <meta
      name="description"
      content="Simulazione anonima e riservata del Test Pratico Ministeriale di sostenibilità del debito (Decreto Dirigenziale — Sezione I) per lo Sportello Composizione Negoziata della Camera di Commercio."
    />
    <meta
      property="og:title"
      content="Pre-Check Composizione Negoziata — Test Pratico Ministeriale"
    />
    <meta
      property="og:description"
      content="Simulazione anonima e riservata del Test Pratico Ministeriale di sostenibilità del debito (Decreto Dirigenziale — Sezione I) per lo Sportello Composizione Negoziata della Camera di Commercio."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-slate-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var devScript = document.querySelector('script[src="/src/main.tsx"]');
        if (!devScript) return;
        var handled = false;
        function handleUncompiledHost() {
          if (handled || window.__APP_MOUNTED__) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          handled = true;
          if (window.location.pathname.indexOf('/docs') === -1) {
            fetch('./docs/index.html', { method: 'HEAD' })
              .then(function (res) {
                if (res.ok) {
                  window.location.replace('./docs/');
                } else if (root) {
                  root.innerHTML =
                    '<div style="max-width:640px;margin:64px auto;padding:24px;font-family:system-ui,sans-serif;background:#fff;border:1px solid #cbd5e1;border-radius:12px;">' +
                    '<h1 style="font-size:18px;font-weight:700;margin:0 0 8px;color:#0f172a;">Applicazione non ancora compilata per GitHub Pages</h1>' +
                    '<p style="font-size:14px;line-height:1.6;color:#334155;margin:0;">Attiva <strong>Settings → Pages → Source: GitHub Actions</strong> nel repository GitHub per pubblicare la build di produzione, oppure pubblica la cartella <code>/docs</code>.</p>' +
                    '</div>';
                }
              })
              .catch(function () {
                window.location.replace('./docs/');
              });
          }
        }
        devScript.addEventListener('error', handleUncompiledHost);
        window.setTimeout(handleUncompiledHost, 1200);
      })();
    </script>
  </body>
</html>
